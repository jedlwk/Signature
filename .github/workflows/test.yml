name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: python3 -m unittest discover -s tests -v
      - name: Check the docs against their own checker
        run: |
          for f in README.md CHANGELOG.md skills/jed-writing-style/SKILL.md skills/jed-writing-style/references/*.md; do
            python3 skills/jed-writing-style/scripts/ai_check.py "$f" --register doc --quiet || true
          done
